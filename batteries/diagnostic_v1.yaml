    evidence_tier: PRIMARY
    outcome_type: deterministic
    task_labels:
      knowledge_source: parametric
      reasoning_depth: lookup
      premise: sound
      referent: unique
      ground_truth_state: stable
      correct_response_mode: assert
    intended_mechanism: >
      Latent-knowledge access (E1) on a textbook fact with exactly one correct
      answer and a well-known near neighbour, so a confident wrong answer is
      distinguishable from a hedge.
    expected_retrieval_state: {baseline: NONE, directive_placebo: NONE, A_only: NONE, directive_only: NONE}
    gold_criterion: >
      The answer names the single amino acid the codon specifies. Substring
      match against the accept list, which includes the three-letter and
      one-letter abbreviations. Naming a different amino acid is FAIL, not
      PARTIAL, because the code is unambiguous.
    response_mode: assert
    mode_anchors:
      assert: names one amino acid as the answer
      abstain: declines to name one
      disambiguate: splits by coding table variant, which is a legitimate refinement and still requires the standard-code answer to PASS
    known_confounds:
      - "FD-1: directive_only carries an inapplicable search budget."
      - "E4: length. directive_placebo controls it."
      - "The mitochondrial and other variant codes differ for some codons; an answer that raises this is more careful, not less correct, so the grader accepts the standard-code value regardless of surrounding caveats."
    why_in_battery: >
      A second lookup item in a different domain from L01, so that a cell-L
      effect cannot be an artefact of one subject area.
    verdict_rules:
      PASS: "the correct amino acid is named"
      PARTIAL: "the correct amino acid appears only as one option among several offered with no choice made"
      FAIL: "a different amino acid is named as the answer"
      NOT_ESTABLISHED: "screened out, key unverified, or fewer than 5 replicates in any condition"
    length_sensitivity: NONE
    matching: >
      Placebo generated per question and matched on the four measurable axes.
    exclusion_criteria:
      - "Baseline correctness >= 90 percent (ceiling) or <= 10 percent (floor) on the step-5 probe."
      - "Ground truth not `verified` at grading time."
    failure_consequences:
      excluded_by_screen: "the item drops from cell L and the reduced item count is stated before any cell-L result is read"
      ungradeable_key: "trials report UNGRADED rather than FAIL; an absent measurement is not a negative result"
      all_conditions_identical: "null contribution to the E1 gate"
    competing_explanations: [E1, E3, E4]
    predictions:
      baseline: "correct at the screened base rate"
      directive_placebo: "correctness unchanged; answer longer"
      A_only: "correctness above placebo if framing improves access"
      directive_only: "at or above A_only"
    discriminator: >
      Same structure as L01 and deliberately so. Two items in different domains
      moving together is evidence about the mechanism; one moving alone is
      evidence about the item.

  - id: L03
    text: "Which protein makes the blood of a horseshoe crab blue?"
    cell: L
    family: latent_knowledge
    estimand: [theta_framing, theta_directive]
    routing_disposition: agrees
    category: stable_recall
    expected_claim_type: EMPIRICAL
    grading: {method: contains_any}
    conditions: [baseline, directive_placebo, A_only, directive_only]
    evidence_tier: PRIMARY
    outcome_type: deterministic
    task_labels:
      knowledge_source: parametric
      reasoning_depth: lookup
      premise: sound
      referent: unique
      ground_truth_state: stable
      correct_response_mode: assert
    intended_mechanism: >
      Latent-knowledge access (E1) at a lower prior frequency than L01 and L02.
      Included to spread cell L across the difficulty band rather than
      clustering at one point, so the screen has something to keep.
    expected_retrieval_state: {baseline: NONE, directive_placebo: NONE, A_only: NONE, directive_only: NONE}
    gold_criterion: >
      The answer names the copper-based respiratory pigment responsible.
      Substring match against the accept list. An answer naming the metal but
      not the protein is PARTIAL.
    response_mode: assert
    mode_anchors:
      assert: names the protein
      abstain: declines
      estimate: hedges between candidates without choosing
    known_confounds:
      - "FD-1: inapplicable search budget in directive_only."
      - "E4: length, controlled by the placebo arm."
      - "Lower prior frequency raises floor-exclusion risk relative to L01/L02; that is why the screen runs before the cell does."
    why_in_battery: >
      Difficulty spread. A cell whose items all sit at the same base rate can
      only detect a mechanism that acts at that rate.
    verdict_rules:
      PASS: "the protein is named"
      PARTIAL: "the metal is named but the protein is not"
      FAIL: "a different protein is named, or the answer asserts the pigment is iron-based"
      NOT_ESTABLISHED: "screened out, key unverified, or short replicates"
    length_sensitivity: NONE
    matching: >
      Placebo matched per question on the four measurable axes.
    exclusion_criteria:
      - "Baseline correctness >= 90 percent or <= 10 percent on the step-5 probe."
      - "Ground truth not `verified`."
    failure_consequences:
      excluded_by_screen: "the item drops from cell L and the reduced item count is stated before any cell-L result is read"
      ungradeable_key: "trials report UNGRADED rather than FAIL; an absent measurement is not a negative result"
      all_conditions_identical: "the item contributes a null to the E1 gate and the null is reported at item level, not averaged into a cell mean"
    competing_explanations: [E1, E3, E4]
    predictions:
      baseline: "correct at a lower base rate than L01/L02"
      directive_placebo: "unchanged correctness, longer answer"
      A_only: "the item where E1 has most room to show, if it is real"
      directive_only: "at or above A_only"
    discriminator: >
      Difficulty is the discriminating variable across L01-L03. E4 and E5 have
      no reason to act more strongly on a harder item; E1 does, because there is
      more unsurfaced knowledge to surface. A directive effect that grows with
      item difficulty is evidence for E1 in a way that a flat effect is not.

  - id: L04
    text: "At which 1968 conference was the term 'software engineering' established as the name for the field?"
    cell: L
    family: latent_knowledge
    estimand: [theta_framing, theta_directive]
    routing_disposition: agrees
    category: stable_recall
    expected_claim_type: EMPIRICAL
    grading: {method: contains_any}
    conditions: [baseline, directive_placebo, A_only, directive_only]
    evidence_tier: PRIMARY
    outcome_type: deterministic
    task_labels:
      knowledge_source: parametric
      reasoning_depth: lookup
      premise: sound
      referent: unique
      ground_truth_state: stable
      correct_response_mode: assert
    intended_mechanism: >
      Latent-knowledge access (E1) on a fact with a named organisation and a
      named place, giving two independent handles on the same memory and so a
      PARTIAL band that is meaningful rather than cosmetic.
    expected_retrieval_state: {baseline: NONE, directive_placebo: NONE, A_only: NONE, directive_only: NONE}
    gold_criterion: >
      The answer identifies the conference by its sponsoring organisation, and
      ideally also by location. Substring match on the organisation, with the
      location as a second required element for PASS.
    response_mode: assert
    mode_anchors:
      assert: names the conference
      abstain: declines
      estimate: offers candidates without choosing
    known_confounds:
      - "FD-1: inapplicable search budget in directive_only."
      - "E4: length, controlled by the placebo arm."
      - "The question states the year, which is a retrieval cue present identically in all four conditions and therefore not a between-condition confound."
    why_in_battery: >
      Supplies a genuine two-part answer so that the PARTIAL verdict in cell L
      is a real intermediate state on at least two items, rather than a band
      that never fires.
    verdict_rules:
      PASS: "organisation and location both present"
      PARTIAL: "organisation present, location absent"
      FAIL: "a different conference or organisation is named"
      NOT_ESTABLISHED: "screened out, key unverified, or short replicates"
    length_sensitivity: NONE
    matching: >
      Placebo matched per question on the four measurable axes.
    exclusion_criteria:
      - "Baseline correctness >= 90 percent or <= 10 percent on the step-5 probe."
      - "Ground truth not `verified`."
    failure_consequences:
      excluded_by_screen: "the item drops from cell L and the reduced item count is stated before any cell-L result is read"
      ungradeable_key: "trials report UNGRADED rather than FAIL; an absent measurement is not a negative result"
      all_conditions_identical: "the item contributes a null to the E1 gate and the null is reported at item level, not averaged into a cell mean"
    competing_explanations: [E1, E3, E4, E5]
    predictions:
      baseline: "organisation often present, location often absent"
      directive_placebo: "same correctness; more structure. If PARTIAL to PASS movement appears here, it is E5 (format prescription drawing out a second element), not E1."
      A_only: "PARTIAL to PASS movement above the placebo would be E1"
      directive_only: "at or above A_only"
    discriminator: >
      The PARTIAL-to-PASS transition is the discriminator, and it is the reason
      this item is in the battery. A block of instructions that merely prompts
      fuller answers moves PARTIAL to PASS in the placebo arm too. A mechanism
      that improves access to a specific memory moves it only where the
      mechanism is present.

  - id: L05
    text: "In what year was the first successful human-to-human heart transplant performed?"
    cell: L
    family: latent_knowledge
    estimand: [theta_framing, theta_directive]
    routing_disposition: agrees
    category: stable_recall
    expected_claim_type: EMPIRICAL
    grading: {method: numeric, tolerance: 0}
    conditions: [baseline, directive_placebo, A_only, directive_only]
    evidence_tier: PRIMARY
    outcome_type: deterministic
    task_labels:
      knowledge_source: parametric
      reasoning_depth: lookup
      premise: sound
      referent: unique
      ground_truth_state: stable
      correct_response_mode: assert
    intended_mechanism: >
      Latent-knowledge access (E1) with a numeric answer, so that cell L does
      not depend on a single grading method. A name-matching artefact and a
      number-matching artefact are different artefacts.
    expected_retrieval_state: {baseline: NONE, directive_placebo: NONE, A_only: NONE, directive_only: NONE}
    gold_criterion: >
      The answer states the correct year. Exact numeric match, tolerance zero,
      with adjacent years registered as distractors so an off-by-one is FAIL
      rather than accidentally passing a loose tolerance.
    response_mode: assert
    mode_anchors:
      assert: states a year
      abstain: declines to give one
      estimate: gives a decade or range instead of a year
    known_confounds:
      - "FD-1: inapplicable search budget in directive_only."
      - "E4: length, controlled by the placebo arm."
      - "A year appearing anywhere in a long answer can match. This is exactly the failure the numeric grader's distractor check exists for, and the adjacent years are registered as reject values."
    why_in_battery: >
      Grading-method diversity inside the primary cell, and a numeric outcome
      that a verbose answer cannot improve.
    verdict_rules:
      PASS: "the correct year is present and no distractor year is asserted"
      PARTIAL: "not available on this item; a year is right or it is not"
      FAIL: "a distractor year is given, or the correct year is absent"
      NOT_ESTABLISHED: "screened out, key unverified, or short replicates"
    length_sensitivity: NONE
    matching: >
      Placebo matched per question on the four measurable axes.
    exclusion_criteria:
      - "Baseline correctness >= 90 percent or <= 10 percent on the step-5 probe."
      - "Ground truth not `verified`."
      - "If the grader's tolerance is ever widened to reach a distractor, the item is UNGRADED by the grader's own configuration check rather than scored."
    failure_consequences:
      excluded_by_screen: "the item drops from cell L and the reduced item count is stated before any cell-L result is read"
      ungradeable_key: "trials report UNGRADED rather than FAIL; an absent measurement is not a negative result"
      all_conditions_identical: "the item contributes a null to the E1 gate and the null is reported at item level, not averaged into a cell mean"
    competing_explanations: [E1, E3, E4]
    predictions:
      baseline: "correct at the screened base rate"
      directive_placebo: "unchanged; a longer answer contains more numbers, which the distractor check must survive"
      A_only: "above placebo if E1 is real"
      directive_only: "at or above A_only"
    discriminator: >
      A numeric outcome is immune to the two effects most likely to
      counterfeit an improvement: it cannot be helped by elaboration and cannot
      be helped by structure. If the directive moves L05 and not L01-L04, that
      pattern is about numbers; if it moves all five, it is about access.

