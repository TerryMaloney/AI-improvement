      the one item in cell U that can see it.

  # ==========================================================================
  # CELL N — unnecessary tool use.  DIAGNOSTIC, counter-based.
  # ==========================================================================
  # The headline here is a COUNT, not a verdict: observed tool calls on
  # questions that need none. exp001 found the directive conditions making
  # fewer tool calls than their controls while scoring lower, which is
  # ambiguous between discipline and starvation. This cell asks the narrower
  # question the ambiguity rests on — does the mechanism suppress tool calls
  # that were never needed?
  #
  # Deterministic by construction: a counter is not a judgement, and
  # correctness on these items is machine-checkable too.

  - id: N01
    text: "What is 17 multiplied by 23?"
    cell: N
    family: unnecessary_tool_use
    estimand: [theta_system]
    routing_disposition: agrees
    category: pure_arithmetic
    expected_claim_type: DETERMINISTIC
    grading: {method: numeric, tolerance: 0}
    conditions: [baseline, search_only, search_directive]
    evidence_tier: DIAGNOSTIC
    outcome_type: deterministic
    primary_metric: tool_calls_observed
    task_labels:
      knowledge_source: derivable
      reasoning_depth: single_step
      premise: sound
      referent: unique
      ground_truth_state: stable
      correct_response_mode: assert
    intended_mechanism: >
      Whether a search-enabled solver spends a tool call on a question that
      cannot benefit from one, and whether the directive suppresses that. The
      DETERMINISTIC route says "Compute it. Do not search." explicitly, so this
      is a direct test of instruction compliance with an observable counter.
    expected_retrieval_state:
      baseline: NONE
      search_only: RETRIEVAL
      search_directive: RETRIEVAL
    gold_criterion: >
      Correctness is exact integer match. The cell's headline is separate: the
      observed tool-call count from harness telemetry, which is authoritative
      over any self-report (FD-2, FD-8). Note that expected_retrieval_state
      records what each arm MAKES AVAILABLE, not what it is predicted to use —
      the prediction that no search occurs lives in `predictions`.
    response_mode: assert
    mode_anchors:
      assert: gives the product
      abstain: declines
      estimate: gives an approximation where an exact value is computable
    known_confounds:
      - "Baseline has no tools, so its count is zero by construction and is not evidence of restraint. Only the search_only versus search_directive contrast is informative, and baseline is present to establish the correctness ceiling."
      - "FD-8: self-reported search counts under-report by roughly half on real runs. Only observed counts are used."
      - "A tool call may be made and then ignored. The counter measures spending, not influence."
    why_in_battery: >
      exp001's cost finding — fewer tool calls AND lower accuracy in the
      directive arm — has two readings, and they have opposite implications for
      whether the mechanism is worth running. This cell separates them on items
      where restraint is unambiguously correct.
    verdict_rules:
      PASS: "correct product AND zero observed tool calls"
      PARTIAL: "correct product with one or more observed tool calls — right answer, wasted spend"
      FAIL: "incorrect product"
      NOT_ESTABLISHED: "observed tool-call telemetry is missing for any trial in a search arm; the count is reported as not measured and no restraint claim is made from it"
    length_sensitivity: NONE
    matching: >
      No placebo arm in this cell. search_only and search_directive differ by
      the directive alone and are otherwise identical, which is the contrast
      that matters for a counter.
    exclusion_criteria:
      - "Harness telemetry unavailable for observed tool calls: the cell's primary metric does not exist and the item is not run rather than being scored on self-report."
    failure_consequences:
      telemetry_missing: "item reports NOT_ESTABLISHED. Self-report is NOT substituted; FD-8 shows it under-reports by about half, and a cost claim built on it would be wrong in a specific, known direction."
      all_arms_zero_calls: "null result — no unnecessary tool use to suppress. Reported as a null about this battery, not as a general finding about tool restraint."
      correctness_drops_in_search_arms: "reported as a separate observation, since a solver that searches and then answers worse is a displacement result and belongs with cell D's reading, not with a cost claim"
    competing_explanations: [E6, E7, E3]
    predictions:
      baseline: "correct, zero calls by construction"
      search_only: "some non-zero rate of unnecessary calls"
      search_directive: "fewer calls than search_only if the directive suppresses waste; equal if compliance is unaffected"
    discriminator: >
      search_directive minus search_only, on the observed count. It is a
      difference of counts on identical prompts differing by one block, which
      is the least ambiguous measurement in the whole battery — no judge, no
      rubric, no ground truth drift.

  - id: N02
    text: "In the word 'bookkeeper', how many pairs of consecutive double letters are there?"
    cell: N
    family: unnecessary_tool_use
    estimand: [theta_system]
    routing_disposition: accepted_as_system
    category: string_inspection
    expected_claim_type: DETERMINISTIC
    grading: {method: numeric, tolerance: 0}
    conditions: [baseline, search_only, search_directive]
    evidence_tier: DIAGNOSTIC
    outcome_type: deterministic
    primary_metric: tool_calls_observed
    task_labels:
      knowledge_source: derivable
      reasoning_depth: single_step
      premise: sound
      referent: unique
      ground_truth_state: stable
      correct_response_mode: assert
    intended_mechanism: >
      Unnecessary tool use on a question answerable by inspecting a string that
      is already in the prompt. Nothing exists to retrieve, so any tool call is
      unambiguously wasted.
    expected_retrieval_state:
      baseline: NONE
      search_only: RETRIEVAL
      search_directive: RETRIEVAL
    gold_criterion: >
      Exact integer match on the count of consecutive doubled-letter pairs.
      The headline metric remains observed tool calls.
    response_mode: assert
    mode_anchors:
      assert: gives a count
      abstain: declines
      estimate: hedges where the string is fully specified
    known_confounds:
      - "Character-level tasks are a known weak point for tokenised models, so correctness here is lower than the task's apparent difficulty suggests. That is fine: the headline is the counter, and a wrong answer with zero tool calls still answers the cell's question."
      - "FD-8: observed counts only."
      - "Baseline's zero count is structural, not behavioural."
    why_in_battery: >
      Pairs with N01 to cover both arithmetic and inspection. If unnecessary
      tool use is a property of "questions that look hard" rather than of
      "questions that need lookup", these two items should diverge.
    verdict_rules:
      PASS: "correct count AND zero observed tool calls"
      PARTIAL: "correct count with one or more observed tool calls"
      FAIL: "incorrect count"
      NOT_ESTABLISHED: "observed telemetry missing in any search arm"
    length_sensitivity: NONE
    matching: >
      No placebo arm; search_only against search_directive.
    exclusion_criteria:
      - "Harness telemetry unavailable for observed tool calls."
      - "Correctness below 20 percent in every arm: the item is measuring tokenisation rather than tool discipline, and the count is still reported but the correctness column is marked uninformative."
    failure_consequences:
      telemetry_missing: "the item reports NOT_ESTABLISHED and self-report is not substituted, because FD-8 shows it under-reports by about half"
      correctness_floor: "the tool-call count is still reported, the correctness column is marked uninformative, and no capability claim is made from it"
      all_arms_zero_calls: "the item contributes a null and is reported as a null about this battery, not as a general finding about tool restraint"
    competing_explanations: [E6, E3, E2]
    predictions:
      baseline: "variable correctness, zero calls by construction"
      search_only: "some unnecessary calls, plausibly more than N01 because the task looks unfamiliar"
      search_directive: "fewer calls if the directive suppresses waste"
    discriminator: >
      N02 against N01 on the search_only count. A higher rate here would mean
      tool use tracks apparent difficulty rather than actual need, which is a
      different and more interesting failure than simple over-searching.

  - id: N03
    text: "Put these three words in alphabetical order: zebra, apple, mango."
    cell: N
    family: unnecessary_tool_use
    estimand: [theta_system]
    routing_disposition: accepted_as_system
    category: ordering
    expected_claim_type: DETERMINISTIC
    grading: {method: contains_any}
    conditions: [baseline, search_only, search_directive]
    evidence_tier: DIAGNOSTIC
    outcome_type: deterministic
    primary_metric: tool_calls_observed
    task_labels:
      knowledge_source: derivable
      reasoning_depth: single_step
      premise: sound
      referent: unique
      ground_truth_state: stable
      correct_response_mode: assert
    intended_mechanism: >
      A floor item for the counter: the task is trivial and every input is
      present. Any tool call here is waste under any reading.
    expected_retrieval_state:
      baseline: NONE
      search_only: RETRIEVAL
      search_directive: RETRIEVAL
    gold_criterion: >
      The three words in the correct order, matched as an ordered substring.
      Headline metric remains observed tool calls.
    response_mode: assert
    mode_anchors:
      assert: gives the ordered list
      abstain: declines
      estimate: not applicable
    known_confounds:
      - "Correctness will be at ceiling, which is intended: this item exists to measure the counter at a point where correctness cannot vary, so a difference in tool calls cannot be attributed to difficulty."
      - "FD-8: observed counts only."
    why_in_battery: >
      A ceiling-correctness anchor for the cell. It isolates the tool-call
      count from every other source of variation, which no other item in the
      battery does.
    verdict_rules:
      PASS: "correct order AND zero observed tool calls"
      PARTIAL: "correct order with one or more observed tool calls"
      FAIL: "incorrect order"
      NOT_ESTABLISHED: "observed telemetry missing in any search arm"
    length_sensitivity: NONE
    matching: >
      No placebo arm; search_only against search_directive.
    exclusion_criteria:
      - "Harness telemetry unavailable for observed tool calls."
    failure_consequences:
      telemetry_missing: "the item reports NOT_ESTABLISHED and self-report is not substituted, because FD-8 shows it under-reports by about half"
      any_nonzero_calls: "a non-zero count HERE is the strongest single piece of evidence in the battery for reflexive tool use, because nothing about the task could motivate it"
    competing_explanations: [E6, E3, E5]
    predictions:
      baseline: "correct, zero calls by construction"
      search_only: "near-zero calls expected; a non-zero rate is reflexive tool use"
      search_directive: "zero calls"
    discriminator: >
      The absolute count in search_only. Unlike every other item in the cell,
      this one has no plausible reason for a tool call at all, so its count is
      a direct estimate of the reflexive rate rather than a contrast.

  - id: N04
    text: "How many days are there in a leap year in the Gregorian calendar?"
    cell: N
    family: unnecessary_tool_use
    estimand: [theta_system]
    routing_disposition: accepted_as_system
    category: definitional_recall
    expected_claim_type: DEFINITIONAL
    grading: {method: numeric, tolerance: 0}
    conditions: [baseline, search_only, search_directive]
    evidence_tier: DIAGNOSTIC
    outcome_type: deterministic
    primary_metric: tool_calls_observed
    task_labels:
      knowledge_source: parametric
      reasoning_depth: lookup
      premise: sound
      referent: unique
      ground_truth_state: stable
      correct_response_mode: assert
    intended_mechanism: >
      Unnecessary tool use on a definitional fact, where the routed claim type
      is DEFINITIONAL rather than DETERMINISTIC. This tests whether tool
      restraint depends on the route the classifier assigns, which is a
      property of the mechanism rather than of the question.
    expected_retrieval_state:
      baseline: NONE
      search_only: RETRIEVAL
      search_directive: RETRIEVAL
    gold_criterion: >
      Exact integer match. Headline metric remains observed tool calls.
    response_mode: assert
    mode_anchors:
      assert: gives the number
      abstain: declines
      disambiguate: distinguishes Gregorian from other calendars, which the question already fixes and which does not change the answer
    known_confounds:
      - "The DEFINITIONAL route carries a search budget of one, unlike DETERMINISTIC's zero. A higher tool-call count in search_directive here than on N01 is therefore a routing effect, not a compliance failure, and must not be reported as one."
      - "FD-8: observed counts only."
      - "Correctness will be at ceiling."
    why_in_battery: >
      The only item in cell N routed to a claim type whose budget is non-zero.
      It is what makes the cell able to distinguish "the directive suppresses
      tool use" from "the directive's budget policy permits tool use here",
      which exp002 was built around and could not fully resolve.
    verdict_rules:
      PASS: "correct number AND observed tool calls within the routed budget"
      PARTIAL: "correct number with observed calls above the routed budget"
      FAIL: "incorrect number"
      NOT_ESTABLISHED: "observed telemetry missing in any search arm"
    length_sensitivity: NONE
    matching: >
      No placebo arm; search_only against search_directive. The routed budget
      differs from N01-N03 by design and the difference is reported, never
      averaged over.
    exclusion_criteria:
      - "Harness telemetry unavailable for observed tool calls."
      - "The classifier routes this item to something other than DEFINITIONAL: the item's purpose is the non-zero budget, and if the route changes the item no longer serves it. Re-check before dispatch."
    failure_consequences:
      telemetry_missing: "the item reports NOT_ESTABLISHED and self-report is not substituted, because FD-8 shows it under-reports by about half"
      route_changed: "item is removed from cell N before dispatch and the removal recorded here, because its whole function is the routed budget"
      count_exceeds_budget: "a compliance failure, reported as such and separately from the restraint contrast"
    competing_explanations: [E6, E5, E3]
    predictions:
      baseline: "correct, zero calls by construction"
      search_only: "some unnecessary calls under the flat budget"
      search_directive: "calls at or below the routed budget of one; comparison with N01's zero-budget route is the measurement"
    discriminator: >
      N04 against N01 within search_directive. Same mechanism, same solver,
      different routed budget. If tool use tracks the budget, the mechanism is
      controlling spend; if it does not, the budget line is decoration and
      exp002's central question gets its answer from a counter rather than from
      an accuracy difference.

  # ==========================================================================
  # CELL C — current-fact tripwire.  MEASUREMENT_VALIDITY.  GATE.
  # ==========================================================================
  # If search does not beat closed-book on facts that postdate training, the
  # retrieval channel is not working and NOTHING else in the run may be
  # interpreted. That is the entire purpose of this cell, and it is why its
  # tier is MEASUREMENT_VALIDITY: a working instrument is a precondition for
  # reading a result, never itself a result about the hypothesis.
  #
  # `gate: true` is enforced by lab/spec.py. A failure here does not lower a
  # number somewhere; it stops the analysis.

  - id: C01
    text: "Which national team won the 2026 FIFA World Cup, and which team did they beat in the final?"
    cell: C
    family: current_fact_tripwire
    estimand: [gate]
    routing_disposition: inert_no_directive_arm
    category: post_cutoff_event
    expected_claim_type: EMPIRICAL
    grading: {method: contains_any}
    conditions: [baseline, search_only]
    evidence_tier: MEASUREMENT_VALIDITY
    gate: true
    outcome_type: deterministic
    primary_metric: verdict
    task_labels:
      knowledge_source: retrieval_required
      reasoning_depth: lookup
      premise: sound
      referent: unique
      ground_truth_state: stable
      correct_response_mode: assert
    intended_mechanism: >
      Instrument validity only. The event postdates any plausible training
      cutoff for the solver models, so a closed-book correct answer is not
      possible and a search-enabled correct answer is straightforward. The
      contrast measures whether retrieval reaches the solver at all.
    expected_retrieval_state:
      baseline: NONE
      search_only: RETRIEVAL
    gold_criterion: >
      The answer names the winning team and the losing finalist. Substring
      match on the winner, with the runner-up as a required second element.
      Ground truth was verified against multiple outlets on the date recorded
      in the answer key, and the result is settled and will not drift.
    response_mode: assert
    mode_anchors:
      assert: names both teams
      abstain: declines, correctly, if the event is after the solver's cutoff and no tool is available
      estimate: guesses a likely winner, which is the failure mode this item detects under baseline
    known_confounds:
      - "`ground_truth_state: stable` is correct despite the event being recent — a completed final does not change. What makes the item work is `knowledge_source: retrieval_required`, and the two labels are independent, which is exactly why they are separate axes."
      - "A confident closed-book guess naming the winner by luck is possible; requiring BOTH finalists makes that much less likely."
      - "E3: k=3 in this cell."
    why_in_battery: >
      Without a tripwire, a null retrieval result anywhere in the battery is
      uninterpretable: it could mean retrieval does not help, or it could mean
      retrieval never happened. This cell decides which, and it must be read
      before anything else.
    verdict_rules:
      PASS: "winner and runner-up both named correctly"
      PARTIAL: "winner named, runner-up absent or wrong"
      FAIL: "wrong winner"
      NOT_ESTABLISHED: "fewer than 3 replicates in either condition, or ground truth not `verified` at grading time"
    length_sensitivity: NONE
    matching: >
      No placebo arm and none is needed: this cell contains no instruction
      contrast, only a tool contrast.
    exclusion_criteria:
      - "The solver model's training cutoff turns out to postdate the event, putting baseline at ceiling and destroying the contrast. Checked in the step-5 screen, per model."
      - "Ground truth not `verified` at grading time."
    failure_consequences:
      search_does_not_beat_closed_book: "HALT. The retrieval channel is not working. No cell-D, cell-N or cell-U search result may be interpreted, and the run is reported as an instrument failure rather than as a set of null results. This is the gate."
      baseline_at_ceiling: "the item is excluded for that model and the tripwire rests on C02 alone for it; if both are excluded for a model, that model's search arms are uninterpretable and are not reported"
      key_unverified: "UNGRADED; the gate cannot be evaluated and the run does not proceed to interpretation"
    competing_explanations: [E1, E6, E3]
    predictions:
      baseline: "fails, or correctly declines; a correct answer would mean the cutoff assumption is wrong"
      search_only: "passes reliably"
    discriminator: >
      E1 against E6, in the cleanest possible form. The fact cannot be in the
      model's parameters, so a correct answer can only have come through the
      tool. Any other reading means the sandbox or the cutoff assumption is
      wrong, and both are instrument problems rather than findings.

  - id: C02
    text: "Which film won the Academy Award for Best Picture at the 2026 Oscars ceremony?"
    cell: C
    family: current_fact_tripwire
    estimand: [gate]
    routing_disposition: inert_no_directive_arm
    category: post_cutoff_event
    expected_claim_type: EMPIRICAL
    grading: {method: contains_any}
    conditions: [baseline, search_only]
    evidence_tier: MEASUREMENT_VALIDITY
    gate: true
    outcome_type: deterministic
    primary_metric: verdict
    task_labels:
      knowledge_source: retrieval_required
      reasoning_depth: lookup
      premise: sound
      referent: unique
      ground_truth_state: stable
      correct_response_mode: assert
    intended_mechanism: >
      Instrument validity only, as a second independent tripwire in a different
      domain, so that a single item's quirk cannot decide whether the whole run
      is interpretable.
    expected_retrieval_state:
      baseline: NONE
      search_only: RETRIEVAL
    gold_criterion: >
      The answer names the winning film. Substring match against the accept
      list. Verified against multiple outlets on the date in the answer key.
    response_mode: assert
    mode_anchors:
      assert: names one film
      abstain: correctly declines when the event is after the cutoff and no tool is available
      estimate: names a likely nominee, which is the baseline failure mode
    known_confounds:
      - "This ceremony is EARLIER in 2026 than C01's event, so it is the more likely of the two to fall inside a recent model's cutoff. That is why there are two tripwires with different dates rather than two with the same one."
      - "A plausible-nominee guess could coincide with the winner. The accept list is the exact title only."
      - "E3: k=3 in this cell."
    why_in_battery: >
      Redundancy on the gate. A gate that rests on one item can be defeated by
      one item's quirk, and the cost of a second tripwire is six dispatches.
    verdict_rules:
      PASS: "the winning film is named"
      PARTIAL: "not available; a film is right or it is not"
      FAIL: "a different film is named"
      NOT_ESTABLISHED: "fewer than 3 replicates in either condition, or ground truth not `verified`"
    length_sensitivity: NONE
    matching: >
      No placebo arm; a tool contrast only.
    exclusion_criteria:
      - "Baseline correct at above chance for a given model: the cutoff postdates the ceremony and the contrast is destroyed for that model. Checked per model in the step-5 screen. This item is the more likely of the two to be excluded on that basis."
      - "Ground truth not `verified`."
    failure_consequences:
      search_does_not_beat_closed_book: "HALT, jointly with C01. The retrieval channel is not working and no search result anywhere in the battery may be interpreted."
      baseline_at_ceiling: "excluded for that model; the gate rests on C01 for it"
      key_unverified: "UNGRADED; the gate cannot be evaluated"
    competing_explanations: [E1, E6, E3]
    predictions:
      baseline: "fails or declines for models whose cutoff precedes March 2026"
      search_only: "passes reliably"
    discriminator: >
      Same as C01 and deliberately redundant. The two differ in date, so a
      disagreement between them localises the solver's cutoff — which is
      information about the instrument, and stays there.
