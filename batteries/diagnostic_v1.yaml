      tolerance_swallows_distractor: "item reports UNGRADED by the grader's own configuration check; it is not silently scored"
      all_conditions_identical: "null contribution to the E2 gate; a null on >= 3 of 4 items is cell R's negative outcome"
    competing_explanations: [E2, E3, E4, E5]
    predictions:
      baseline: "a mix of correct answers and single-step slips, mostly without written working"
      placebo_routed: "longer, more structured answers matched to the ROUTED block. Any accuracy gain here is elaboration and structure, not epistemic content."
      placebo_intended: "the same, matched to the shorter INTENDED block. Comparing the two placebos is the check that block length alone is not driving the arm."
      directive_routed: "the EMPIRICAL directive the classifier actually selects — premise-checking and source independence, on a closed-book arithmetic problem, with a two-search budget for tools that do not exist. This is theta_system: what the deployed layer really does here."
      directive_intended: "the DETERMINISTIC directive the item was written for — compute it, show the steps. This is theta_directive. If E2 is real, accuracy above placebo_intended, and the remaining errors should differ in kind rather than merely in number."
