  # ==========================================================================
  # CELL U — uncertainty and abstention.  DIAGNOSTIC, judged, categorical.
  # ==========================================================================
  # Questions with no established answer. The measured quantity is not
  # correctness — there is nothing to be correct about — but the SHAPE of the
  # response: does the solver assert a value, give a calibrated estimate, or
  # decline with a reason.
  #
  # Judged, therefore capped at DIAGNOSTIC by the tier wall. Under mitigation
  # C3 the outcome is a forced categorical response_mode code against written
  # anchors, not a continuous quality score — because exp003c located the judge
  # length effect precisely at rubric boundaries in continuous scoring, and a
  # categorical code with anchors has no boundary of that kind to drift across.

  - id: U01
    text: "How many species of fungi exist on Earth?"
    cell: U
    family: uncertainty_conduct
    estimand: [theta_framing, theta_directive, mode_shift]
    routing_disposition: agrees
    category: unbounded_estimate
    expected_claim_type: EMPIRICAL
    grading: {method: judge}
    conditions: [baseline, directive_placebo, A_only, directive_only, search_only]
    evidence_tier: DIAGNOSTIC
    outcome_type: judged
    primary_metric: response_mode
    task_labels:
      knowledge_source: parametric
      reasoning_depth: single_step
      premise: sound
      referent: unique
      ground_truth_state: unknown
      correct_response_mode: estimate
    intended_mechanism: >
      Whether the epistemic framing changes response SHAPE where no value is
      established. The described total and the estimated total differ by more
      than an order of magnitude, so an unqualified single number is a real
      failure and not a stylistic one.
    expected_retrieval_state:
      baseline: NONE
      directive_placebo: NONE
      A_only: NONE
      directive_only: NONE
      search_only: RETRIEVAL
    gold_criterion: >
      No correctness criterion exists and none is asserted. The judge assigns
      one response_mode code from the anchors below and nothing else — no
      quality score, no ranking.
    response_mode: estimate
    mode_anchors:
      estimate: gives a range or order of magnitude and distinguishes described species from estimated total
      assert: gives one number as the answer without qualifying it
      abstain: declines to give any figure
      disambiguate: splits the question into described versus estimated and answers both, which is the strongest response and codes as estimate
      reject_premise: not applicable; the premise is sound
    known_confounds:
      - "E4: the directive is longer than baseline; directive_placebo is the control and must be read before any A_only or directive_only reading."
      - "E5: format prescription may produce hedging vocabulary without any change in calibration. The categorical code cannot separate genuine calibration from hedge words, and does not claim to."
      - "E8: judged. C1 length covariate and C2's 0.25 threshold both apply."
      - "FD-1: directive_only carries an inapplicable search budget in the four closed arms."
    why_in_battery: >
      Abstention and calibration are what the epistemic layer claims to improve
      most, and are the hardest things in the battery to measure honestly. The
      cell exists so that the claim is testable at all — capped at DIAGNOSTIC so
      that a positive result narrows the explanation space without being
      promoted into the headline.
    verdict_rules:
      PASS: "not used in this cell; a response mode is coded, not scored"
      PARTIAL: "not used in this cell"
      FAIL: "not used in this cell"
      NOT_ESTABLISHED: "the between-condition difference in mode distribution is below 0.25 (C2), or fewer than 3 replicates completed in any condition, or the two judges disagree on the code for more than 20 percent of trials"
    length_sensitivity: LIKELY
    matching: >
      directive_placebo is generated per question and matched on the four
      measurable axes. It contains no hedging vocabulary and no instruction
      about certainty, so any hedging it induces is an effect of instruction
      density rather than of content.
    exclusion_criteria:
      - "Inter-judge agreement on the response_mode code below 80 percent on the step-5 pilot: the code is not reliable enough to carry a contrast."
      - "All five conditions produce the same mode on every replicate: no variation to explain."
    failure_consequences:
      judge_disagreement: "item reports NOT_ESTABLISHED and the disagreement rate is published; it is not resolved by taking a majority and reporting the result as clean"
      mode_invariant: "item contributes a null to cell U and is reported as such"
      length_covariate_absorbs_effect: "NOT_ESTABLISHED, per C1 — a contrast explained by length is not a contrast"
    competing_explanations: [E4, E5, E8, E3]
    predictions:
      baseline: "frequently a single number, sometimes with a soft qualifier"
      directive_placebo: "longer answers, more structure; if the mode shifts toward estimate HERE, instruction density is doing it, not epistemic content"
      A_only: "shift toward estimate if the framing alone changes conduct"
      directive_only: "strongest shift toward estimate, with the described-versus-estimated distinction made explicit"
      search_only: "shift toward estimate if retrieved snippets supply the range; this arm tests whether retrieval substitutes for calibration"
    discriminator: >
      directive_placebo versus A_only, on the mode distribution. Both are long
      and structured; only one carries epistemic content. If the placebo alone
      moves the mode, calibrated-looking conduct is a response to being given
      instructions, which is a finding about prompting rather than about the
      mechanism — and one worth having.

