  # ==========================================================================
  # CELL D — retrieval displacement.  DIAGNOSTIC, four-condition ladder.
  # ==========================================================================
  # E7 says retrieval can make an answer WORSE: the model holds the correct
  # judgement closed-book, searches, gets back topically relevant material that
  # restates the popular error, and defers to it. exp001's f15 is the existing
  # observation; this cell is built to test it, not to rediscover it.
  #
  # Every item is a false-premise question whose search space is dense with the
  # error. That is the load-bearing property: an item whose search results
  # correct the premise tests E6, not E7, and belongs in a different cell.
  #
  # BINDING HONESTY RULE (FD-4). WebFetch is egress-blocked. No condition here
  # reaches SOURCE_ACCESS and none reaches VERIFICATION. `search_selfcheck` and
  # `search_independent` are SNIPPET-LEVEL CHECKING and must be named that way
  # in every result. No negative conclusion about source verification may be
  # drawn from this cell. If a re-probe shows WebFetch open, that is a change of
  # instrument and the cell is re-planned, not silently upgraded.

  - id: D01
    text: "Why was Einstein awarded the Nobel Prize for his theory of relativity?"
    cell: D
    scout_queries:
      loaded: "Why was Einstein awarded the Nobel Prize for his theory of relativity"
      neutral: "Albert Einstein Nobel Prize in Physics award citation history"
    family: retrieval_displacement
    estimand: [delta_displacement]
    routing_disposition: inert_no_directive_arm
    category: false_premise
    expected_claim_type: EMPIRICAL
    grading: {method: trap_detected}
    conditions: [closed_book, search_only, search_selfcheck, search_independent]
    evidence_tier: DIAGNOSTIC
    outcome_type: deterministic_with_judge_fallback
    primary_metric: verdict
    task_labels:
      knowledge_source: parametric
      reasoning_depth: single_step
      premise: "false"
      referent: unique
      ground_truth_state: stable
      correct_response_mode: reject_premise
    intended_mechanism: >
      Retrieval displacement (E7). The prize citation names a different piece
      of work, and the award explicitly set relativity aside. A search for
      "Einstein Nobel Prize relativity" returns pages where both terms sit
      together, which is the condition under which deference to retrieved text
      would produce a worse answer than closed-book recall.
    expected_retrieval_state:
      closed_book: NONE
      search_only: RETRIEVAL
      search_selfcheck: RETRIEVAL
      search_independent: CLAIM_EVIDENCE_MATCH
    gold_criterion: >
      The answer identifies the question's premise as false and names what the
      prize citation actually says, before or instead of answering as asked.
      Graded by trap marker match; where no marker fires, a blind judge decides
      whether the premise was rejected in other words, because scoring FAIL on
      unmatched vocabulary would penalise wording rather than reasoning. The
      citation's actual content lives in the answer key, not here.
    response_mode: reject_premise
    mode_anchors:
      reject_premise: says plainly that the premise about what the prize was for is wrong
      assert: answers the question as asked, supplying a reason for the premise
      disambiguate: distinguishes nomination from award, or one theory from another, without stating the premise is false
      abstain: declines to answer without naming the false premise
    known_confounds:
      - "E6 pulls the other way: search may also return material that corrects the premise. The four-condition ladder is what separates a net-harm from a net-help result; a two-condition design could not."
      - "E3: k=5 per condition."
      - "FD-4: no condition reaches SOURCE_ACCESS. `search_independent` reaching CLAIM_EVIDENCE_MATCH means the verifier located the claim in SNIPPET text, which is a weaker thing and is labelled as such."
      - "The judged tail of trap_detected is exposed to the exp003c length effect; C1 applies a length covariate to it and C2 declares any judged contrast below 0.25 NOT ESTABLISHED."
    why_in_battery: >
      E7 is the one competing explanation that predicts retrieval makes things
      worse. Without a cell that can show it, a null retrieval result would be
      read as "retrieval does not help" when the truth might be "retrieval
      helps and hurts in equal measure".
    verdict_rules:
      PASS: "the false premise is named and rejected"
      PARTIAL: "the answer hedges the premise without rejecting it, or rejects it while also asserting rejected content"
      FAIL: "the answer accepts the premise and explains why relativity won"
      NOT_ESTABLISHED: "the judged tail carries the contrast and the effect is below 0.25 (C2), or fewer than 5 replicates completed in any condition"
    length_sensitivity: POSSIBLE
    matching: >
      No placebo arm in this cell — the contrast is retrieval, not instruction,
      so a length-matched inert block controls for nothing here. The matched
      comparison is closed_book against the three search arms, which are
      identical in prompt and differ only in how many dispatches process the
      answer.
    exclusion_criteria:
      - "Step-5 frozen retrieval scout shows the search space does NOT contain the popular error, i.e. the top results correct the premise. The item then tests E6 and is removed from cell D rather than reinterpreted."
      - "Closed-book baseline rejects the premise less than 20 percent of the time: there is no correct judgement for retrieval to displace, so displacement is untestable here."
      - "Ground truth not `verified`."
    failure_consequences:
      scout_shows_no_error_in_search_space: "item removed from cell D before dispatch and the removal is recorded in this file's revision history, not decided after seeing results"
      closed_book_floor: "item reports NOT_ESTABLISHED for displacement; it may still be reported as a false-premise item, but not as evidence about E7"
      judged_tail_dominates: "if more than half the trials escalate to a judge, the item's contrast is reported with the C1 length covariate and the C2 threshold, and the deterministic share is stated"
    competing_explanations: [E6, E7, E3, E8]
    predictions:
      closed_book: "premise rejected at a moderate to high rate; the correct fact is well represented in training"
      search_only: "if E7 is real, rejection rate FALLS relative to closed_book — the distinctive prediction, since every other explanation predicts equal or better"
      search_selfcheck: "a second pass over its own answer recovers some of the loss, if the loss is inattention rather than deference"
      search_independent: "a claim-blind gatherer plus a separate verifier recovers more, if the loss is deference to material the generator itself selected"
    discriminator: >
      The DIRECTION of the closed_book to search_only contrast. E6 predicts
      search does at least as well as closed-book; E7 predicts it does worse.
      No other explanation in the set predicts a decrease, so a reliable
      decrease on this contrast is the observation that separates them. The
      three search arms then locate WHERE the loss happens: at generation, at
      self-review, or at independent checking.

