# ============================================================================
# diagnostic_v1 — the exp003a battery. FROZEN SPECIFICATION.
# ============================================================================
#
# Committed BEFORE any solver dispatch. Every item carries a complete written
# specification: what it is here to detect, which competing explanations could
# also move it, what each condition is predicted to do, the observation that
# separates them, how it is graded, what excludes it, and what each failure
# forces. An item without a discriminator that separates at least two
# explanations does not enter the battery, however interesting it is.
#
# WHAT THIS FILE MAY NOT CONTAIN: any ground-truth value. `gold_criterion`
# states HOW correctness is decided, never WHAT the answer is. The values live
# in batteries/answers.diagnostic_v1.yaml, which no prompt-building code
# imports, and a test asserts that no answer-key string appears anywhere in
# this file.
#
# THE TIER WALL (lab/spec.py). Each item declares `evidence_tier`, and the tier
# caps what its result may ever be cited for:
#
#   MEASUREMENT_VALIDITY  the instrument works, or does not. Never evidence
#                         about any explanation or mechanism.
#   DIAGNOSTIC            rules a competing explanation in or out. Never
#                         establishes the mechanism hypothesis itself.
#   PRIMARY               may carry a mechanism effect. Must be deterministic.
#
# The order matters: measurement validity -> diagnostic result -> primary
# result, and results never travel up. A diagnostic finding that the instrument
# is sensitive to some feature is a fact about the instrument. It does not
# become evidence for the hypothesis because it appeared in the same table.
#
# CONDITIONS USED HERE
#   baseline           question alone
#   directive_placebo  matched inert block (lab/placebo.py), no mechanism
#   A_only             epistemic framing alone, on a length-matched carrier
#   directive_only     the full routed directive, closed-book
#   search_only        search tool, flat budget, no directive
#   search_directive   search tool plus the full routed directive
#   closed_book        cell D's no-tool arm
#   search_selfcheck   two dispatches: answer, then self-review of own answer
#   search_independent three dispatches: generator, claim-blind gatherer, verifier
#
# KNOWN INSTRUMENT CONSTRAINTS BINDING ON EVERY ITEM (docs/EXP003A_FROZEN_DECISIONS.md)
#   FD-1  closed-book directive packets contain a search budget for tools that
#         do not exist. Frozen as measured. Named as a confound on every item
#         that runs `directive_only`.
#   FD-2  the solver-facing prompt still asks for `searches_used`; only storage
#         and reporting are deprecated.
#   FD-4  WebFetch is egress-blocked. SOURCE_ACCESS and VERIFICATION are
#         unreachable, so no item may be specified to reach them and no
#         conclusion about them may be drawn from this battery.
#   FD-7  the placebo's effect on RESPONSE length is unverified until solver
#         data exists.
#   C1-C4 exp003c mitigations: length covariate on judged contrasts, the 0.25
#         NOT ESTABLISHED rule, cell U as forced categorical, k=3 judging.

id: diagnostic_v1
description: >
  Mechanism-disambiguation battery for exp003a. Six cells, twenty-five items,
  each specified before dispatch. Built to separate E1-E8 rather than to
  maximise an accuracy number.
asked_as_of: "2026-08-28"
requires_task_labels: true
requires_item_spec: true

questions:

  # ==========================================================================
  # CELL L — latent knowledge access.  PRIMARY, deterministic, closed-book.
  # ==========================================================================
  # E1 says the directive helps a model surface knowledge it already holds. If
  # that is real, it shows up here and nowhere else: no tools, stable facts,
  # nothing to retrieve. The screen in step 5 removes items at ceiling (every
  # condition gets it, so nothing can move) and at floor (the knowledge is not
  # there to surface, so E1 cannot apply). What survives is the band where the
  # mechanism could act.

  - id: L01
    text: "What is the SI unit of magnetic flux, and after whom is it named?"
    cell: L
    family: latent_knowledge
    estimand: [theta_framing, theta_directive]
    routing_disposition: agrees
    category: stable_recall
    expected_claim_type: EMPIRICAL
    grading: {method: contains_any}
    conditions: [baseline, directive_placebo, A_only, directive_only]
    evidence_tier: PRIMARY
    outcome_type: deterministic
    task_labels:
      knowledge_source: parametric
      reasoning_depth: lookup
      premise: sound
      referent: unique
      ground_truth_state: stable
      correct_response_mode: assert
    intended_mechanism: >
      Latent-knowledge access (E1). The unit and its eponym are firmly in any
      broad training corpus, so a miss is a retrieval failure rather than an
      absence. If epistemic framing improves access to held knowledge, a closed
      book item like this is where it must appear.
    expected_retrieval_state: {baseline: NONE, directive_placebo: NONE, A_only: NONE, directive_only: NONE}
    gold_criterion: >
      The answer names the correct SI unit and the correct physicist. Graded by
      case-insensitive substring match against the accept list, with the
      eponym required as a second element. Naming the unit but not the person
      is PARTIAL by rule, not by judgement.
    response_mode: assert
    mode_anchors:
      assert: states the unit and the eponym as fact
      abstain: declines, e.g. reports not knowing the unit or the person
      estimate: offers a hedge or range where a single settled name exists
    known_confounds:
      - "FD-1: the directive_only packet states a search budget for tools it does not have. Any directive_only effect here is confounded with whatever an impossible instruction does to compliance."
      - "E4: directive_only is longer than baseline. directive_placebo is the control for that and must be read first."
      - "E3: k=5 per cell. A 1/5 difference is within noise and is not read as an effect."
    why_in_battery: >
      One of six items chosen so that E1 has somewhere to show up that no other
      explanation reaches. Closed book removes E6 and E7; deterministic grading
      removes E8; the placebo arm removes E4 and E5.
    verdict_rules:
      PASS: "unit and eponym both present"
      PARTIAL: "unit present, eponym absent or wrong"
      FAIL: "unit absent or wrong"
      NOT_ESTABLISHED: "answer key status is not `verified`, or the step-5 screen excluded the item, or fewer than 5 replicates completed in any condition"
    length_sensitivity: NONE
    matching: >
      directive_placebo is generated per question by lab/placebo.py and matched
      to this item's routed directive on word count within 10 percent, bullet
      count, structure and formatting markers. A_only carries the epistemic
      framing on a carrier of the same length.
    exclusion_criteria:
      - "Knowledge probe (step 5) shows >= 90 percent correct under baseline: ceiling, nothing can move."
      - "Knowledge probe shows <= 10 percent correct under baseline: floor, the knowledge is not present to surface, so E1 cannot be tested here."
      - "Ground truth cannot be confirmed `verified` at grading time."
    failure_consequences:
      excluded_by_screen: "item drops out of cell L; cell L reports on the reduced item count and the exclusion is named in the report, never silently absorbed"
      ungradeable_key: "trials are reported UNGRADED, not FAIL; a missing measurement is not a negative result"
      all_conditions_identical: "contributes a null to cell L; a null on >= 4 of 6 items is the gate's negative outcome for E1"
    competing_explanations: [E1, E3, E4, E5]
    predictions:
      baseline: "correct at the screened base rate, no premise talk, short answer"
      directive_placebo: "same correctness as baseline; longer, more structured answer. Any correctness gain here is E4/E5, not the mechanism."
      A_only: "if E1 is real, correctness above directive_placebo; framing alone is enough"
      directive_only: "if E1 is real, correctness at or above A_only. If directive_only > A_only, the procedural bullets add something beyond framing."
    discriminator: >
      directive_placebo separates E4 and E5 from everything else, because it
      matches length and format while carrying no mechanism. A_only minus
      directive_placebo is the epistemic framing effect with length held
      constant. Any effect surviving both contrasts is E1 or E2, and E2 has no
      purchase on a lookup item, which is what makes reasoning_depth lookup a
      required label here rather than a description.

  - id: L02
    text: "In the standard genetic code, which amino acid is specified by the codon UGG?"
    cell: L
    family: latent_knowledge
    estimand: [theta_framing, theta_directive]
    routing_disposition: agrees
