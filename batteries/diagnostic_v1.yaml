  # ==========================================================================
  # CELL R — reasoning where retrieval is useless.  PRIMARY, deterministic.
  # ==========================================================================
  # E2 says the directive improves reasoning rather than recall. These items are
  # self-contained: every input is in the question, so there is nothing to look
  # up and no fact to be stale. That removes E1, E6 and E7 by construction, and
  # numeric grading removes E8. What is left to explain a movement is E2, E3,
  # E4 and E5 — and the placebo arm separates the last two.
  #
  # The routed claim type here is DETERMINISTIC, whose directive says "Compute
  # it. Do not search." and "Show the steps so the arithmetic is checkable."
  # That instruction is a plausible reasoning aid, which is precisely why the
  # placebo has to be length-matched: "write more" is also a plausible
  # reasoning aid, and the two are otherwise indistinguishable.

  - id: R01
    text: >-
      A tank holds 240 litres when full. It is currently five-eighths full.
      45 litres are drained out. Then a further amount equal to one third of
      what remains is poured in. How many litres are in the tank now?
    cell: R
    family: closed_reasoning
    estimand: [theta_directive, theta_system, theta_routing]
    routing_disposition: crossed
    category: arithmetic_multistep
    expected_claim_type: DETERMINISTIC
    grading: {method: numeric, tolerance: 0.5}
    conditions: [baseline, placebo_routed, placebo_intended, directive_routed, directive_intended]
    evidence_tier: PRIMARY
    outcome_type: deterministic
    primary_metric: verdict
    task_labels:
      knowledge_source: derivable
      reasoning_depth: multi_step
      premise: sound
      referent: unique
      ground_truth_state: stable
      correct_response_mode: assert
    intended_mechanism: >
      Reasoning improvement (E2). Three chained operations where an error in
      any one propagates, so the failure modes are distinguishable from each
      other by the value produced rather than only by being wrong.
    expected_retrieval_state: {baseline: NONE, placebo_routed: NONE, placebo_intended: NONE, directive_routed: NONE, directive_intended: NONE}
    gold_criterion: >
      A single final volume in litres. Exact numeric match within a tolerance
      strictly below the nearest distractor gap, with each step-skipping error
      registered as a distractor value so that a near-miss is FAIL rather than
      a loose pass.
    response_mode: assert
    mode_anchors:
      assert: gives one final number
      abstain: declines to compute
      estimate: gives a range where an exact value follows from the premises
    known_confounds:
      - "FD-1: directive_only states a search budget of zero while also saying the solver has no tools. Milder than the empirical route but the same contradiction."
      - "E4/E5: the DETERMINISTIC directive asks for the steps to be shown, which lengthens and structures the answer. directive_placebo is matched on both and is the control that separates them from E2."
      - "E3: k=5. A single-replicate difference is noise."
    why_in_battery: >
      One of four items giving E2 a place to act that E1, E6 and E7 cannot
      reach. Chained arithmetic is where showing the steps should help most if
      showing the steps is what helps.
    verdict_rules:
      PASS: "the correct final value appears and no distractor value is asserted"
      PARTIAL: "not available; the arithmetic is right or it is not"
      FAIL: "a distractor value is asserted, or the correct value is absent"
      NOT_ESTABLISHED: "fewer than 5 replicates completed in any condition, or the grader refuses the configuration because the tolerance reaches a distractor"
    length_sensitivity: NONE
    matching: >
      directive_placebo is generated for this question and matched on word
      count within 10 percent, bullet count, structure and formatting markers.
