    failure_consequences:
      scout_shows_no_error_in_search_space: "the item is removed from cell D before dispatch and the removal is recorded in this file, not decided after seeing results"
      closed_book_floor: "the item reports NOT_ESTABLISHED for displacement and may not be cited as evidence about E7 in either direction"
      judged_tail_dominates: "the contrast is reported with the C1 length covariate applied and the deterministic share of trials stated alongside it"
    competing_explanations: [E6, E7, E3, E8]
    predictions:
