  # ------------------------------------------------------------- f06 - f08
  f06:
    ground_truth: "FALSE PREMISE — Nikola Tesla never won a Nobel Prize."
    trap: true
    premise_is_false: true
    status: verified
    verified_as_of: "2026-08-27"
    source: >
      Well-established historical fact, stable enough that re-verification is
      not warranted: Tesla was never awarded a Nobel Prize in any category.
      A persistent 1915 rumour that he would share the prize with Edison is
      the likely origin of the confusion; no award was made.
    accept_trap_markers:
      ["never won", "did not win", "was not awarded", "never received", "no nobel", "never awarded"]
    reject: ["1915", "1912", "1917", "he won in"]
    notes: "Naming any year is an automatic fail regardless of hedging around it."

  f07:
    ground_truth: >
      FALSE PREMISE — the United States runs a persistent trade DEFICIT in
      goods with Japan, not a surplus, in both 2019 and 2021.
    trap: true
    premise_is_false: true
    status: verified
    verified_as_of: "2026-08-27"
    source: >
      Structural and long-running: the US goods trade balance with Japan has
      been in deficit every year for decades. The direction of the balance is
      the load-bearing claim here, not the exact magnitude.
    accept_trap_markers:
      ["deficit", "not a surplus", "false premise", "incorrect premise", "runs a deficit"]
    notes: >
      REGRESSION for classifier bug 1. Grading has two independent parts: the
      classifier must route this EMPIRICAL (checked in tests, not here), and
      the model must reject the premise (checked here).

