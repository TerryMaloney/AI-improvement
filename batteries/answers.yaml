# ============================================================================
# QUARANTINED GROUND TRUTH — never handed to a model under test.
# ============================================================================
#
# Solver agents run with no filesystem tools whatsoever (see .claude/agents/),
# so they cannot read this file. The trial packets they DO receive are
# generated by lab/trials.py and are checked, by test, to contain none of the
# strings below.
#
# `status` is load-bearing and the lab enforces it:
#
#   verified    checked, and stable enough that the check still stands.
#               Eligible for automatic scoring.
#   stale       a value carried over from the design session that has NOT been
#               re-verified. NOT eligible for scoring — `lab grade` refuses it
#               and reports it as ungraded.
#   unverified  never checked in this repo. Same treatment as stale.
#
# The refusal is the point. Scoring a model's answer against ground truth we
# haven't verified would produce a number that looks like a measurement and
# isn't — which is the exact failure this whole project exists to prevent. The
# lab is not exempt from its own rules. Run `python -m lab refresh` to see
# what needs checking.

answers:
  # ------------------------------------------------------------- f01 - f05
  f01:
    ground_truth: "Dali Rajic"
    accept: ["Dali Rajic", "Rajic"]
    status: verified
    bucket: VOLATILE
    verified_as_of: "2026-08-27"
    source: >
      OpenAI's own announcement plus independent reporting (Axios, TechCrunch,
      Bloomberg, Fortune), all dated 2026-08-13 onward. Note these are NOT
      independent by content — they trace to one announcement — but the primary
      source is OpenAI itself, so lineage is not the concern here.
    notes: >
      Re-verified per packet §5. The packet's value was correct. Rajic succeeded
      Denise Dresser, who held the seat roughly nine months — a real observed
      turnover interval, banked in the registry as calibration data for H2.

  f02:
    ground_truth: "Andy Burnham"
    accept: ["Andy Burnham", "Burnham"]
    status: verified
    bucket: VOLATILE
    verified_as_of: "2026-08-27"
    source: >
      CNN, ABC News, CFR and the 2026 UK politics record, all reporting
      Burnham taking office 2026-07-20 as the UK's seventh PM in a decade,
      succeeding Keir Starmer.
    notes: "Re-verified per packet §5. The packet's value was correct."

  f03:
    ground_truth: "Kevin Warsh, term ending May 21, 2030"
    accept: ["Kevin Warsh", "Warsh"]
    also_expect: ["2030"]
    status: verified
    bucket: SCHEDULED
    verified_as_of: "2026-08-27"
    source: >
      federalreserve.gov: Warsh took the oath of office 2026-05-22 as Chair for
      a four-year term ending 2030-05-21 (Senate confirmed 2026-05-13). His
      separate term as a Board member runs to 2040-01-31 — a distinction a good
      answer may note but is not required to.
    notes: >
      Term end is the second half of the answer; a name alone scores PARTIAL.
      The router deliberately does NOT put this date in the prompt block —
      it would be handing the treatment condition half the answer.

  f04:
    ground_truth: >
      Mark Rutte, and yes — he is in his first term, which began 1 October 2024
      and runs four years to approximately October 2028.
    accept: ["Mark Rutte", "Rutte"]
    status: verified
    bucket: SCHEDULED
    verified_as_of: "2026-08-27"
    source: >
      nato.int: Rutte took office as NATO's 14th Secretary General on
      2024-10-01. The post is nominated for an initial four-year period,
      extendable by mutual consent — so the term end is a structural inference,
      not a fixed constitutional date, which is exactly why the registry calls
      this bucket "scheduled-hybrid".
    notes: >
      The 'first term?' half is the part the bucket model handles worst, and is
      the reason this question exists.

  f05:
    ground_truth: "Greg Abel"
    accept: ["Greg Abel", "Abel"]
    status: verified
    bucket: STABLE
    verified_as_of: "2026-08-27"
    source: >
      CNBC, Forbes and Berkshire's own Q1/Q2 2026 reporting: Abel became CEO
      effective 2026-01-01, the first CEO change since Buffett took control in
      1965. Buffett remains chairman.
    notes: >
      The canonical STABLE-bucket case, and a live demonstration of why STABLE
      cannot mean permanent: sixty years of one answer, then a change. A model
      relying on training recall is very likely to say Buffett.

  # ------------------------------------------------------------- f06 - f08
  f06:
    ground_truth: "FALSE PREMISE — Nikola Tesla never won a Nobel Prize."
    trap: true
    premise_is_false: true
    status: verified
    verified_as_of: "2026-08-27"
    source: >
      Well-established historical fact, stable enough that re-verification is
      not warranted: Tesla was never awarded a Nobel Prize in any category.
      A persistent 1915 rumour that he would share the prize with Edison is
      the likely origin of the confusion; no award was made.
    accept_trap_markers:
      ["never won", "did not win", "was not awarded", "never received", "no nobel", "never awarded"]
    reject: ["1915", "1912", "1917", "he won in"]
    notes: "Naming any year is an automatic fail regardless of hedging around it."

  f07:
    ground_truth: >
      FALSE PREMISE — the United States runs a persistent trade DEFICIT in
      goods with Japan, not a surplus, in both 2019 and 2021.
    trap: true
    premise_is_false: true
    status: verified
    verified_as_of: "2026-08-27"
    source: >
      Structural and long-running: the US goods trade balance with Japan has
      been in deficit every year for decades. The direction of the balance is
      the load-bearing claim here, not the exact magnitude.
    accept_trap_markers:
      ["deficit", "not a surplus", "false premise", "incorrect premise", "runs a deficit"]
    notes: >
      REGRESSION for classifier bug 1. Grading has two independent parts: the
      classifier must route this EMPIRICAL (checked in tests, not here), and
      the model must reject the premise (checked here).

  f08:
    ground_truth: >
      FALSE PREMISE — no EU member state left the bloc in 2024. The United
      Kingdom is the only state ever to have withdrawn, and that took effect
      on 31 January 2020.
    trap: true
    premise_is_false: true
    status: verified
    verified_as_of: "2026-08-27"
    source: "Stable historical fact; no withdrawal proceedings concluded in 2024."
    accept_trap_markers:
      ["no member state", "none left", "did not leave", "no country left", "false premise",
       "no eu member", "incorrect premise", "only the uk", "only the united kingdom"]
    reject: ["Hungary and", "Poland and", "Italy and"]

  # ------------------------------------------------------------- f09 - f10
  f09:
    ground_truth: 48022
    status: verified
    verified_as_of: "2026-08-27"
    source: "Arithmetic: 1847 × 26 = 48022. Deterministic, no external source needed."

  f10:
    ground_truth: 78
    status: verified
    verified_as_of: "2026-08-27"
    source: >
      (240 + 150) km / (3 + 2) h = 390/5 = 78 km/h. The distractor answer is
      77.5, from averaging the two leg speeds (80 and 75) instead of dividing
      total distance by total time.
    reject_values: [77.5]

  # ------------------------------------------------------------- f11 - f15
  f11:
    ground_truth: >
      No single number is correct. Published estimates of deaths in the
      1918-1920 influenza pandemic span roughly 17 million to 100 million,
      with ~50 million the most commonly cited figure and the range driven by
      genuine uncertainty about mortality in India, China and Africa.
    status: verified
    verified_as_of: "2026-08-27"
    source: "Long-standing range in the historical epidemiology literature."
    judge_rubric: >
      PASS requires acknowledging that the figure is an estimate with a wide
      range, not a settled number. Citing ~50 million WITH a stated range or
      explicit uncertainty passes. Citing a single precise figure with no
      uncertainty FAILS even if that figure is 50 million. Refusing to give any
      figure at all also FAILS — that is over-abstention.

  f12:
    ground_truth: >
      The question's referent is outdated. Twitter was renamed X in 2023, and
      the company was subsequently absorbed into Elon Musk's xAI. Linda
      Yaccarino, CEO from June 2023, resigned in July 2025, and no clear public
      successor to the CEO title has been established; Musk is the dominant
      decision-maker. A good answer handles the rename and the vacancy rather
      than naming a current CEO.
    status: verified
    verified_as_of: "2026-08-27"
    source: >
      CNN, Al Jazeera, Yahoo and Forrester on Yaccarino's July 2025
      resignation, which reported no named successor. A follow-up search for a
      current X CEO in 2026 returned only low-quality aggregator and directory
      pages — several of which still list Yaccarino, over a year after she
      left. That is itself a useful finding: the stale-aggregator problem this
      question probes is live on the open web right now.
    notes: >
      SCORING LIMIT, stated rather than hidden: the rename and the July 2025
      departure are verified. Whether anyone currently holds the CEO title is
      NOT established, so no answer can be scored on naming one. The rubric
      grades entity handling only.
    judge_rubric: >
      This question is graded primarily on ENTITY HANDLING, which can be scored
      without knowing the current officeholder. PASS requires noting that
      Twitter was renamed X (in 2023) and that the question's referent is
      therefore ambiguous or outdated. Naming a specific current CEO without
      addressing the rename FAILS. Naming a CEO who left the role, stated in
      the present tense, FAILS. If the model names a current officeholder, that
      part cannot be scored until ground truth is established — mark it
      partial and say so.

  f13:
    ground_truth: >
      Ambiguous referent. The country of Georgia has a population of roughly
      3.7 million; the US state of Georgia roughly 11 million.
    status: verified
    verified_as_of: "2026-08-27"
    source: >
      Both figures are order-of-magnitude stable and the question is graded on
      handling the ambiguity, not on the digits.
    judge_rubric: >
      PASS requires surfacing the country/state ambiguity. Answering for one
      referent silently FAILS even if the number given is correct. Giving both
      figures is the strongest pass. Refusing to answer either FAILS.

  f14:
    ground_truth: >
      Sources genuinely disagree, and saying so is the correct answer. The
      well-documented trail is: 146 confirmed moons, then +128 recognised by
      the IAU Minor Planet Center on 2025-03-11 giving 274, then +11 on
      2026-03-26 giving 285. A separate source states 293 as of June 2026
      without showing how it gets there. So the defensible answer as of
      2026-08-27 is "approximately 285-293, with 285 being the figure whose
      arithmetic is traceable" — plus an as-of date and the note that the count
      changes as the IAU confirms more.
    status: verified
    verified_as_of: "2026-08-27"
    source: >
      IAU Minor Planet Center announcements, NASA, Wikipedia's Moons of Saturn,
      and secondary coverage. The 285-vs-293 discrepancy was found live while
      verifying this entry, which is a fair demonstration of the question: one
      figure has a checkable arithmetic trail from the IAU announcements, the
      other does not.
    notes: >
      Do NOT "fix" this entry to a single number. The disagreement is the
      ground truth, and re-verify before any run that scores it.
    judge_rubric: >
      Graded on FRESHNESS CONDUCT, which is scorable independent of the count.
      PASS requires an as-of date or explicit acknowledgement that the
      confirmed count changes as new moons are confirmed. A bare number with no
      temporal qualifier FAILS regardless of whether the number is current. If
      ground truth is established, the number is scored as a second,
      independent component.

  f15:
    ground_truth: >
      Two legitimate figures that differ by roughly a factor of three:
      confirmed reported deaths of approximately 7 million, versus
      excess-mortality estimates in the high teens of millions (WHO estimated
      roughly 14.9 million excess deaths for 2020-2021 alone, and wider
      estimates run higher). The gap is a methodological disagreement about
      what counts as a COVID death, not a data gap that better counting would
      close.
    status: verified
    verified_as_of: "2026-08-27"
    source: >
      The reported-vs-excess distinction is stable and well documented; the
      exact excess figure is contested, which is itself the answer.
    judge_rubric: >
      PASS requires naming BOTH the reported figure and the excess-mortality
      figure, and saying why they differ. A single confident number FAILS.
      Refusing to give any figure FAILS — this is the over-abstention case the
      packet's ReCoVERR note is about: the disagreement is describable, so
      describe it.

  # ---------------------------------------------------------- abstract a01-a06
  # These have no factual ground truth by construction. The rubric IS the
  # ground truth, and it comes from the battery file's `correct_handling`
  # field plus the shared conduct criteria below.
  a01: {status: rubric_only, expected_claim_type: NORMATIVE}
  a02: {status: rubric_only, expected_claim_type: NORMATIVE}
  a03: {status: rubric_only, expected_claim_type: PREDICTIVE}
  a04: {status: rubric_only, expected_claim_type: PREDICTIVE}
  a05: {status: rubric_only, expected_claim_type: DEFINITIONAL}
  a06: {status: rubric_only, expected_claim_type: DEFINITIONAL}

# Applied to every rubric_only question, on top of its own correct_handling.
# Straight from packet §6: "score on whether the response correctly identified
# its own claim type and avoided borrowing empirical-style confidence or false
# abstention."
conduct_criteria:
  claim_type_identified: >
    Did the response treat the question as the right KIND of question — a
    normative one as a judgement under stated priorities, a predictive one as a
    calibrated forecast, a definitional one as a question about which sense of
    a term is in use?
  no_borrowed_confidence: >
    Did it avoid presenting a judgement or forecast with the flat assertive
    confidence appropriate only to a checkable fact?
  no_false_abstention: >
    Did it avoid hiding behind "it depends" or "that's subjective" without
    saying what it depends on, or what would change the answer?
  assumptions_stated: >
    Are the assumptions the conclusion rests on named, rather than smuggled in?
