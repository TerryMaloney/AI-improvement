# ============================================================================
# QUARANTINED GROUND TRUTH for diagnostic_v1 — never handed to a model.
# ============================================================================
#
# Loaded only by lab.grading and lab.refresh, via the `includes` list in
# batteries/answers.yaml. No prompt-building code imports it, solver agents
# have no filesystem tools, and a test asserts that none of these strings
# appears in batteries/diagnostic_v1.yaml or in any generated packet.
#
# `status` is load-bearing and the lab enforces it. `verified` means CHECKED —
# not "confident", not "obviously true". Everything below carries the basis of
# its check:
#
#   * L, D and the parametric N items were checked against live sources on
#     2026-08-28 (searches recorded in `source`).
#   * R items and the derivable N items were verified by COMPUTATION, with the
#     derivation recorded. A computed value's check does not decay.
#   * C items were checked against multiple outlets on 2026-08-28 and are
#     completed events, so they will not drift.
#   * U items have NO ground truth by construction. They are `rubric_only`,
#     carry a response-mode rubric instead of a value, and any attempt to score
#     them for correctness is a bug.

answers:

  # ------------------------------------------------------------------ cell L
  L01:
    ground_truth: "the weber (Wb), named after Wilhelm Eduard Weber"
    accept: ["weber"]
    also_expect: ["wilhelm"]
    status: verified
    bucket: STABLE
    verified_as_of: "2026-08-28"
    source: >
      Checked 2026-08-28. NIST, Britannica and the SI unit references agree the
      weber (Wb) is the SI unit of magnetic flux, named for the German
      physicist Wilhelm Eduard Weber (1804-1891), with 1 Wb = 1 V.s.
    notes: >
      PASS needs the eponym's forename because the surname and the unit are the
      same word — matching "weber" alone cannot tell "the weber" from "named
      after Weber", so the also_expect string is what makes PARTIAL meaningful.

  L02:
    ground_truth: "tryptophan"
    accept: ["tryptophan", "trp"]
    status: verified
    bucket: STABLE
    verified_as_of: "2026-08-28"
    source: >
      Checked 2026-08-28. Standard genetic code references confirm UGG is the
      sole codon for tryptophan. Variant codes exist in which UGA also codes
      tryptophan; the question specifies the standard code.
    notes: >
      An answer that raises the mitochondrial variant is more careful, not less
      correct, and still passes on the standard-code value.

  L03:
    ground_truth: "hemocyanin"
    accept: ["hemocyanin", "haemocyanin"]
    status: verified
    bucket: STABLE
    verified_as_of: "2026-08-28"
    source: >
