  # ------------------------------------------------------------------ cell C
  C01:
    ground_truth: "Spain, beating Argentina 1-0 after extra time on 19 July 2026"
    accept: ["spain"]
    also_expect: ["argentina"]
    status: verified
    bucket: STABLE
    verified_as_of: "2026-08-28"
