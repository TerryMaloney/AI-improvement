<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cherry Sweeper</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#57203c,#210f23 62%,#150d19);color:#fff0ce;font-family:"Trebuchet MS",system-ui,sans-serif}
main{width:min(100%,420px);padding:14px}
.machine{background:#45182d;border:2px solid #c79a58;border-radius:24px;padding:15px;box-shadow:inset 0 0 0 4px #64253d,0 14px 38px #10081288}
header{text-align:center;background:linear-gradient(145deg,#97394b,#70203c);border:1px solid #e0ac69;border-radius:13px;padding:10px 4px 12px}
.lights{height:6px;margin:0 10px 8px;background:radial-gradient(circle,#ffe3a0 2px,transparent 3px) center/16px 6px repeat-x}
.reels{display:inline-flex;gap:2px;background:#352128;border:2px solid #b8874d;border-radius:7px;overflow:hidden}
.reels span{display:grid;place-items:center;width:40px;height:30px;background:linear-gradient(#ddc399,#fff2cd 40%,#e9d1a6);font:italic 900 26px Georgia;color:#b73142}
h1{font:italic 900 clamp(36px,10vw,50px)/1 Georgia,serif;letter-spacing:-2px;margin:6px 0 0;color:#fff0bb;text-shadow:0 3px #692239}
.stats{display:flex;justify-content:space-between;padding:12px 2px 8px;font-size:13px;color:#eed3b4}
.stats b{color:#fff1c7;font-variant-numeric:tabular-nums}
#board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:6px;background:#271223;border:1px solid #a57652;border-radius:10px}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.tile{aspect-ratio:1;min-width:0;border:1px solid #cf8a96;border-bottom:3px solid #68283e;border-radius:6px;background:linear-gradient(155deg,#ac5268,#89394f);color:#eeb4a6;font:700 clamp(19px,6vw,27px)/1 Georgia,serif;padding:0;text-shadow:0 1px #6a3344}
.tile.open,.tile.show{border:1px solid #bb9e7e;background:#f8e7c9;color:#392e44;text-shadow:none}
.tile.empty{background:#e7d4b6}
.tile[data-count="1"]{color:#21657d}.tile[data-count="2"]{color:#397044}.tile[data-count="3"]{color:#ac3548}
.tile.hit{background:#ffb2a0}
.tile.marked{background:#854159;color:#ffe0a2}
button:focus-visible{outline:3px solid white;outline-offset:1px;z-index:1}
.controls{display:flex;gap:8px;margin-top:10px}
.controls button{flex:1;border:1px solid #bc9064;border-radius:8px;padding:9px 3px;background:#55283c;color:#ffeaca;font-weight:700;font-size:14px}
.controls button[aria-pressed=true]{background:#ffe1a2;color:#4a2435}
#status{text-align:center;font-weight:700;font-size:15px;min-height:20px;margin:12px 0 2px;color:#ffe19b}
.help{margin:11px 4px 0;color:#f1d9cb;font-size:14px;line-height:1.45;text-align:center}
@media(hover:hover){.tile.cover:hover{filter:brightness(1.17)}.controls button:hover{filter:brightness(1.12)}}
</style>
</head>
<body>
<main>
<section class="machine" aria-label="Cherry Sweeper game">
<header>
<div class="lights"></div>
<div class="reels" aria-hidden="true"><span>🍒</span><span>7</span><span>🍒</span></div>
<h1>Cherry Sweeper</h1>
</header>
<div class="stats"><span>💀 <b>6</b> skulls</span><span>Safe tiles <b id="score">0 / 30</b></span></div>
<div id="board" role="group" aria-label="Game board"></div>
<div class="controls">
<button id="flag" aria-pressed="false">⚑ Flag mode</button>
<button id="reset">↻ New round</button>
</div>
<p id="status" role="status"></p>
</section>
<p class="help">Tap a tile to reveal it. Each number counts skulls touching that tile, including diagonally. Use <b>Flag mode</b> to mark suspected skulls. Reveal all 30 safe tiles to hit the jackpot.</p>
</main>
<script>
const size = 6, skullCount = 6, total = size * size;
const board = document.getElementById('board');
const flag = document.getElementById('flag');
const statusLine = document.getElementById('status');
const faces = [...document.querySelectorAll('.reels span')];
let tiles, started, ended, flagMode, cleared, hit;

function neighbors(i) {
  const row = Math.floor(i / size), col = i % size, result = [];
  for (let r = Math.max(0,row-1); r <= Math.min(size-1,row+1); r++) {
    for (let c = Math.max(0,col-1); c <= Math.min(size-1,col+1); c++) {
      if (r*size+c !== i) result.push(r*size+c);
    }
  }
  return result;
}
function deal(first) {
  const safe = new Set([first, ...neighbors(first)]);
  const pool = tiles.map((_,i) => i).filter(i => !safe.has(i));
  for (let n = 0; n < skullCount; n++) {
    const j = Math.floor(Math.random()*pool.length);
    tiles[pool.splice(j,1)[0]].skull = true;
  }
  tiles.forEach((t,i) => t.count = neighbors(i).filter(j => tiles[j].skull).length);
  started = true;
}
function paint() {
  tiles.forEach((t,i) => {
    const btn = board.children[i];
    let symbol = '✦', style = 'cover', label = 'covered';
    if (ended && t.skull) {
      symbol = '💀'; style = i === hit ? 'show hit' : 'show'; label = 'skull';
    } else if (t.open) {
      symbol = t.count ? String(t.count) : '🍒';
      style = t.count ? 'open' : 'open empty';
      label = t.count + ' adjacent skulls';
    } else if (t.mark) {
      symbol = '⚑'; style = 'marked'; label = 'flagged';
    }
    btn.className = 'tile ' + style;
    btn.dataset.count = t.open ? t.count : '';
    btn.textContent = symbol;
    btn.setAttribute('aria-label', `Row ${1+Math.floor(i/size)}, column ${1+i%size}, ${label}`);
  });
  document.getElementById('score').textContent = `${cleared} / ${total-skullCount}`;
  flag.setAttribute('aria-pressed', String(flagMode));
  flag.disabled = ended;
}
function activate(i, marking) {
  if (ended || tiles[i].open) return;
  if (marking) {
    tiles[i].mark = !tiles[i].mark;
    paint(); return;
  }
  if (tiles[i].mark) return;
  if (!started) deal(i);
  if (tiles[i].skull) {
    ended = true; hit = i;
    faces.forEach(f => f.textContent = '💀');
    statusLine.textContent = 'Bust! Tap New round to play again.';
  } else {
    const pending = [i];
    while (pending.length) {
      const j = pending.pop(), t = tiles[j];
      if (t.open || t.mark || t.skull) continue;
      t.open = true; cleared++;
      if (t.count === 0) pending.push(...neighbors(j));
    }
    ended = cleared === total-skullCount;
    if (ended) {
      faces.forEach(f => f.textContent = '7');
      statusLine.textContent = 'Jackpot! You cleared the board. 🍒';
    } else {
      statusLine.textContent = `${total-skullCount-cleared} safe tiles left.`;
    }
  }
  paint();
}
function newRound() {
  tiles = Array.from({length:total}, () => ({open:false,mark:false,skull:false,count:0}));
  started = ended = flagMode = false; cleared = 0; hit = -1;
  ['🍒','7','🍒'].forEach((s,i) => faces[i].textContent = s);
  statusLine.textContent = 'Pick any tile. Your first tap is safe.';
  paint();
}
for (let i = 0; i < total; i++) {
  const btn = document.createElement('button');
  btn.onclick = () => activate(i,flagMode);
  btn.oncontextmenu = e => { e.preventDefault(); activate(i,true); };
  board.append(btn);
}
flag.onclick = () => {
  flagMode = !flagMode;
  statusLine.textContent = flagMode ? 'Tap a tile to place or remove a flag.' : 'Tap an unflagged tile to reveal it.';
  paint();
};
document.getElementById('reset').onclick = newRound;
newRound();
</script>
</body>
</html>
