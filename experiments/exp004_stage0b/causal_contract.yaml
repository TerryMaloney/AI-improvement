  - item_selection_rule FINGERPRINT (the rule itself is now written, implemented and
    tested), which cannot be fixed until the recipe is validated
  - freeze_grade_analyse_driver for a three-dispatch trial
  - production items (NOT to be authored until the recipe is validated)
