assumed_absent_edges:
  - edge: [treatment, evaluator]
    check:
      type: deterministic_route
      artifact: "[OPEN]"
      test: "[OPEN]"
      note: Final-answer extraction/grading must be identical across A0/B3/C3/D3.
  - edge: [treatment, item]
    check:
      type: fingerprint
      artifact: "[OPEN]"
      test: "[OPEN]"
      note: Every arm receives the same frozen item instance; development items are barred.
  - edge: [selection, outcome]
    check:
      type: proof_or_rule
      artifact: docs/EXP005_PROCEDURE_DISCOVERY_2026-09-09.md#8
      note: Procedure promotion rules are committed before EXP005A outcomes and cannot select tasks.
  - edge: [served_model, treatment]
    check:
      type: recorded_value
      artifact: "[OPEN]"
      note: Served model identity must be recorded per dispatch; model drift cannot be arm-correlated silently.
  - edge: [system_instructions, treatment]
    check:
      type: byte_identity
      artifact: "[OPEN]"
      test: "[OPEN]"
      note: Shared system instructions must be byte-identical except the explicitly fingerprinted role/procedure packet.
  - edge: [missingness, treatment]
    check:
      type: proof_or_rule
      artifact: "[OPEN]"
      note: Failure/retry semantics must be fixed before dispatch so one arm cannot be selectively retried.
  - edge: [shared_latent, outcome]
    check:
      type: design
      artifact: docs/EXP005_PROCEDURE_DISCOVERY_2026-09-09.md#5.5
      note: Fresh contexts are required for independent samples/verifier calls; C3 intentionally keeps one context lineage and that dependence is the treatment.
