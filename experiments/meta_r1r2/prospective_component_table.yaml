title: Prospective R1'/R2' vs churn component table -- Stage 0A-M harness
frozen_at_commit: 37ac525f0b0cb7c82245ea4520518aa1a66f066a
frozen_on: '2026-09-02'
purpose: Committed BEFORE the next independent audit so the classification cannot be reconstructed after a defect location
  is known.
churn_definition: Number of commits on branch claude/ai-testing-lab-setup-b4t7qr whose diff touches the artifact path, as
  reported by `git log --oneline -- <path>` at frozen_at_commit. Components with no artifact have churn 0 by definition.
r1_prime: Defects found by later independent review concentrate in components that are treatment-asymmetric (or of unknown
  symmetry) AND lack an executed invariance check.
r2_prime: Drift between two representations of one construct occurs only where no correspondence test binds them.
churn_rival: Defects concentrate where artifacts were edited most, regardless of causal role.
discriminating_cells:
  r1_high_churn_low:
  - configured_effort
  - live_agent_registry
  - served_model_per_trial
  r1_low_churn_high:
  - manifest
  - specification
  - analysis_null
  note: A defect in the first group supports R1' over churn; a defect in the second supports churn over R1'.
what_future_observations_mean:
  SUPPORT_R1_PRIME: next load-bearing defect found in configured_effort / live_agent_registry / served_model_per_trial, or
    in any other unchecked component
  SUPPORT_CHURN: next load-bearing defect found in manifest / specification / analysis_null / packet_retrieval (high-churn,
    checked)
  HURT_BOTH: next load-bearing defect found in a low-churn, checked, symmetric component (e.g. schedule, keys) -- neither
    theory predicts it
  NON_DISCRIMINATING: defect found in packet_retrieval by a NON-invariance route (e.g. wording semantics) -- both theories
    can claim it; or defects in prose-only spec sections that are both high-churn and unbound
exclusions: The live_agent_registry failure on 2026-09-01 and every defect logged in FABLE_5_1_RESEARCH_DISCOVERY_2026-09-01.md
  were used to CONSTRUCT R1'/R2' and do not count as prospective confirmation.
